
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: LucasBritoSilva
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23E63946&color_dots=%230D0D0D,%23330000,%238B0000,%23CC2936,%23FF3333

      - name: Push snake animation
        uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
